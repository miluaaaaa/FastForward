[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastforward-accel"
version = "0.2.4.post1"
description = "FastForward: model-specific accelerated visual choice inference"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "torchvision", "transformers>=4.57", "numpy", "Pillow", "opencv-python", "peft", "safetensors", "accelerate", "triton", "imagecodecs", "pyspng"]

[project.scripts]
fastforward-accel = "fastforward_accel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastforward_accel = ["*.json", "_legacy/*.c"]
